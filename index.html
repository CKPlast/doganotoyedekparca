<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOĞAN OTO YEDEK PARÇA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff; 
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(30, 41, 59, 0.1); 
            text-align: center;
            max-width: 360px;
            width: 90%;
            margin: 20px auto;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-img {
            width: 200px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        h1 {
            color: #1e293b; 
            font-size: 24px; 
            margin-bottom: 8px;
            font-weight: 800; 
            letter-spacing: 0.5px;
            text-transform: uppercase; 
        }
        
        .subtitle {
            color: #16a34a; 
            font-size: 13px;
            margin-bottom: 25px; 
            font-weight: 700; 
            line-height: 1.6; 
            letter-spacing: 0.5px;
            text-transform: uppercase; 
            padding: 0 5px; 
        }
        
        .section-title {
            font-size: 13px;
            color: #1e293b; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 12px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            font-weight: 700;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(22, 163, 74, 0.15);
        }
        .btn:active { transform: scale(0.98); }
        
        /* Renk Kombinasyonları */
        .btn-call { background-color: #16a34a; color: #ffffff; border: 2px solid #16a34a; } 
        .btn-whatsapp { background-color: #25D366; color: #ffffff; border: 2px solid #25D366; } /* WhatsApp Yeşili */
        .btn-maps { background-color: #ffffff; color: #16a34a; border: 2px solid #16a34a; } 
        
        /* Hover Efektleri */
        .btn-call:hover { background-color: #15803d; border-color: #15803d; }
        .btn-whatsapp:hover { background-color: #1ebe57; border-color: #1ebe57; }
        .btn-maps:hover { background-color: #f8fafc; }
        
        /* Profesyonel Footer Alanı */
        .footer-wrapper {
            margin-top: 30px;
            border-top: 1px dashed #e2e8f0; 
            padding-top: 15px;
        }
        .legal-footer {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 3px;
        }
        .creator-tag {
            font-size: 10px; 
            color: #cbd5e1; 
            text-decoration: none; 
            transition: color 0.2s ease; 
            display: inline-block;
            font-weight: 400;
        }
        .creator-tag span {
            font-weight: 700; 
            color: #94a3b8; 
        }
        .creator-tag:hover, .creator-tag:hover span {
            color: #16a34a; 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logonuz varsa "Doganlogo.png" adıyla aynı klasöre eklemeyi unutmayın -->
    <img src="Doganlogo.png" alt="DOĞAN OTO YEDEK PARÇA LOGO" class="logo-img">
    
    <h1>DOĞAN OTO YEDEK PARÇA</h1>
    
    <div class="subtitle">ORJİNAL YEDEK PARÇA</div>
    
    <div class="section-title">📍 İletişim - Doğan OĞAN</div>
    
    <a href="tel:+905446329091" class="btn btn-call">📞 Doğan OĞAN Ara</a>
    <a href="https://wa.me/905446329091?text=Merhaba,%20yedek%20parça%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="btn btn-whatsapp">💬 WhatsApp'tan Yaz</a>
    <a href="https://www.google.com/maps/dir//Do%C4%9Fan+oto+yedek+par%C3%A7a,+Sanayi,+60033.+Cd.+No:62,+27110,+27110+%C5%9Eehitkamil%2FGaziantep/@37.0637477,37.3353723,12.75z/data=!4m8!4m7!1m0!1m5!1m1!1s0x1531e5ba2a98109d:0xdc256c5ef2d44f8b!2m2!1d37.4383913!2d37.0788314?entry=ttu&g_ep=EgoyMDI2MDYwOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="btn btn-maps">🗺️ Yol Tarifi Al</a>
    
    <div class="footer-wrapper">
        <div class="legal-footer">© 2026 Doğan Oto Yedek Parça</div>
        <a href="#" target="_blank" class="creator-tag">Dijital Kart Tasarımı: <span>CK Plast</span></a>
    </div>
</div>

</body>
</html>
